# ==============================================================================
# Cloudflare Tunnel Configuration Template (cloudflared)
# ==============================================================================
# Copy this file to 'config.yml' and replace the placeholders:
#   1. Replace <TUNNEL_ID> with the UUID generated by `cloudflared tunnel create <NAME>`
#   2. Replace <PATH_TO_CREDENTIALS_JSON> with the credentials file location
#   3. Replace app.yourdomain.com with your active Cloudflare domain / subdomain
# ==============================================================================

# Tunnel UUID or Name
tunnel: <TUNNEL_ID>

# Path to the tunnel credentials file (created during `cloudflared tunnel create`)
# Example Windows path: C:\Users\<YourUser>\.cloudflared\<TUNNEL_ID>.json
credentials-file: C:\Users\<YourUser>\.cloudflared\<TUNNEL_ID>.json

# Log level: info, warn, error, debug
loglevel: info

# Ingress Rules (First matching rule is applied)
ingress:
  # Rule 1: Route public subdomain to the Next.js Engineering Practice Engine
  - hostname: app.yourdomain.com
    service: http://localhost:3000
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false
      httpHostHeader: localhost:3000
      disableChunkedEncoding: false
      keepAliveTimeout: 90s
      keepAliveConnections: 100

  # Rule 2: (Optional) Route staging/dev instances running on alternate port (e.g. 3010)
  # - hostname: dev.yourdomain.com
  #   service: http://localhost:3010
  #   originRequest:
  #     httpHostHeader: localhost:3010

  # Rule 3: Mandatory Catch-All (Returns HTTP 404 for any unmatched hostnames)
  - service: http_status:404
